services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helper
      POSTGRES_PASSWORD: helper
      POSTGRES_DB: helper
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helper"]
      interval: 2s
      timeout: 2s
      retries: 20
